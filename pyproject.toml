[project]
name = "openalt-name-labels"
version = "0.1.0"
description = "OpenAlt conference name labels on a Bixolon XD5 label printer (macOS/Linux)"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "openalt_name_labels/fonts/OFL.txt"]
authors = [{ name = "Jaroslav Řezník", email = "jaroslav.reznik@openalt.org" }]
maintainers = [{ name = "OpenAlt", email = "jaroslav.reznik@openalt.org" }]
dependencies = ["pillow>=10", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
openalt-name-labels = "openalt_name_labels.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openalt_name_labels*"]

[tool.setuptools.package-data]
openalt_name_labels = ["fonts/*.ttf", "fonts/OFL.txt"]
